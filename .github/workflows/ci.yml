name: CI

on:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64 (gcc), os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { name: Linux x64 (clang), os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { name: Linux arm64 (gcc), os: ubuntu-24.04-arm, cc: gcc, cxx: g++ }
          - { name: macOS universal, os: macos-latest, universal: true }
          - { name: Windows x64 (MSVC), os: windows-latest, msvc: true }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libcurl4-openssl-dev zlib1g-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_INSTALL_PREFIX=$PWD/install

      - name: Configure (macOS, arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_INSTALL_PREFIX=$PWD/install

      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Both slices
        if: runner.os == 'macOS'
        run: lipo -archs build/examples/shop && lipo -archs build/crashpad/handler/crashpad_handler

      - name: Tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Crash, walk and check
        shell: bash
        run: bash e2e/ci.sh build "$RUNNER_TEMP/e2e"

      - name: Install, then find_package(zharp) from a fresh project
        shell: bash
        run: |
          cmake --install build --config RelWithDebInfo
          cmake -S tests/consumer -B consumer-build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$PWD/install" ${{ matrix.universal && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}
          cmake --build consumer-build --config RelWithDebInfo
          ctest --test-dir consumer-build -C RelWithDebInfo --output-on-failure

      - name: Crash diagnostics (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo dmesg | grep -iE 'segfault|traps|crashpad|shop' | tail -n 20 || true
          echo "ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope)"
          sudo apt-get install -y -qq --no-install-recommends gdb strace > /dev/null
          export ZHARP_KEY=zpk_e2e ZHARP_ENDPOINT=http://127.0.0.1:9/api/v1/otlp ZHARP_DATABASE_PATH="$RUNNER_TEMP/diag" ZHARP_DEBUG=1
          mkdir -p "$RUNNER_TEMP/cores"
          echo "$RUNNER_TEMP/cores/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          build/examples/shop abort || echo "exited with $?"
          for core in "$RUNNER_TEMP"/cores/core.*; do
            echo "== $core"
            exe=build/examples/shop; case "$core" in *crashpad*) exe=build/crashpad/handler/crashpad_handler ;; esac
            gdb -batch -ex 'info signals SIGSEGV' -ex 'thread apply all bt 20' "$exe" "$core" 2>&1 | grep -v '^\[New LWP' | head -n 80
          done
          strace -f -e trace=process,signal -o "$RUNNER_TEMP/strace.txt" build/examples/shop abort || true
          echo "clone/fork calls: $(grep -cE 'clone|fork' "$RUNNER_TEMP/strace.txt")"
          head -n 120 "$RUNNER_TEMP/strace.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.cc || 'default' }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  without-crashpad:
    name: Linux, ZHARP_CRASHPAD=OFF, shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libcurl4-openssl-dev
      - run: cmake -S . -B build -G Ninja -DZHARP_CRASHPAD=OFF -DBUILD_SHARED_LIBS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  qt:
    name: Qt ${{ matrix.qt }} · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, qt: '6.8.3', arch: linux_gcc_64 }
          # macos-15: Qt 6.8.3's CMake files link the AGL framework, which the Xcode 26 SDK (macos-26) no longer has.
          - { name: macOS, os: macos-15, qt: '6.8.3', arch: clang_64 }
          - { name: Windows (MSVC), os: windows-latest, qt: '6.8.3', arch: win64_msvc2022_64 }
          - { name: Linux (Ubuntu's Qt), os: ubuntu-22.04, qt: '5.15', distro: true }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libcurl4-openssl-dev zlib1g-dev \
            libgl1-mesa-dev libegl1 libxkbcommon0 libfontconfig1 \
            ${{ matrix.distro && 'qtbase5-dev qtdeclarative5-dev qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-templates2 qml-module-qtquick-window2' || '' }}

      - name: Qt ${{ matrix.qt }}
        if: ${{ !matrix.distro }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true

      - name: Configure (Linux, macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DZHARP_QT=ON ${{ matrix.distro && '-DZHARP_QT_MAJOR=5' || '' }}

      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DZHARP_QT=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Tests (the Qt layer on the offscreen platform)
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Crash, walk and check (the widgets and QML shops)
        shell: bash
        run: bash e2e/qt/ci.sh build "$RUNNER_TEMP/e2e-qt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-qt-${{ matrix.os }}-${{ matrix.qt }}
          path: ${{ runner.temp }}/e2e-qt
          if-no-files-found: ignore
